# Kabuk Server settings (/data/kabuk/etc/kabuk.conf).
# The watchdog re-reads this file every 30 seconds. To apply service or network
# changes run:  su -c '/data/kabuk/bin/kabuk restart'

# --- charging ---------------------------------------------------------------
# Battery charge window driven by /sys/class/power_supply/battery/input_suspend.
# Charging stops at CHARGE_STOP, resumes at CHARGE_START (hysteresis) and is
# always allowed below CHARGE_FAILSAFE.
CHARGE_LIMIT=1
CHARGE_STOP=80
CHARGE_START=75
CHARGE_FAILSAFE=70

# Battery temperature (Celsius). Above HOT_C heavy work is moved to the little
# cores and niced; above HOT_STOP_CHARGE_C charging stops.
HOT_C=40
HOT_STOP_CHARGE_C=45

# Wakelock policy: auto (only while work is running or a charge window is open)
# | always | off
WAKELOCK=auto

# runit services, space separated (each one needs a directory in sv/)
SERVICES="tailscaled sshd taildrop ttyd ntfy kabuk-agent"

# Tailscale: tun (real tailscale0 interface, recommended) | userspace (fallback
# when the kernel has no TUN; mosh does not work in userspace mode)
TS_MODE=tun
TS_HOSTNAME=note10

# sshd listen address. Empty = the tailscale0 address (recommended).
# Never expose this to the LAN or the internet.
SSH_LISTEN=""

# Web terminal (ttyd) port, bound to the tailnet interface only.
# Credentials: /data/kabuk/rootfs/etc/kabuk/ttyd.cred
TTYD_PORT=7681

# Kabuk Agent (chat UI for Claude Code) port, tailnet only.
AGENT_PORT=8787

# LAN firewall: drop new connections arriving on wlan+/eth+ (Tailscale UDP 41641
# stays open). Set to 0 only for debugging.
FIREWALL=1

# Extra TCP ports to allow from the LAN (e.g. "5555" for wireless adb). Keep empty.
# FW_ALLOW_TCP="5555"

# Name of the persistent tmux session
SESSION=claude

# If the network has been down for this many seconds, restart Wi-Fi
# (at most once every 15 minutes)
NET_RESET_AFTER=300

# Notifications: ntfy topic inside the tailnet, e.g. http://note10:8090/kabuk
NTFY_URL=""

# Full root inside the chroot: 1 = passwordless sudo for the user plus the
# `android` helper (runs commands on the Android side as root). 0 = disabled.
FULL_ROOT=0
